server {
    # Puerto no privilegiado (imagen nginx-unprivileged corre como uid 101)
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to PHP backend
    location /api/ {
        proxy_pass http://ubi-php:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy to Python backend.
    # Sin URI en proxy_pass: Nginx reenvía la ruta completa (/ubi/...) sin
    # reescribir, de modo que coincide con el prefijo real del router FastAPI.
    location /ubi/ {
        proxy_pass http://ubi-python:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Widget de chat embebible: lo consumen sitios EXTERNOS mediante
    # <script src="https://.../script/index.js">. Se sirve como archivo estático
    # del build (admin/public/script/index.js). Cache corta (no inmutable) para
    # poder actualizar el widget sin quedar cacheado un año.
    location = /script/index.js {
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
