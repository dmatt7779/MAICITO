<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/api

    <Directory /var/www/html/api>
        AllowOverride All
        Require all granted
    </Directory>

    # Serve uploaded files and images from shared volume
    Alias /public/files /var/www/shared/files
    Alias /public/images /var/www/shared/images

    <Directory /var/www/shared>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
